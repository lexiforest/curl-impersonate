name: Build for windows
on:
  workflow_call:
  push:
    branches:
      - main
      - feature/*
      - bugfix/*
      - chore/*
      - security/*
  pull_request:
    branches:
      - main

permissions: {}

env:
  LICENSE_FILES: >-
    LICENSE
    LICENSE_BORINGSSL
    LICENSE_BROTLI
    LICENSE_CARES
    LICENSE_CURL
    LICENSE_NGHTTP2
    LICENSE_NGHTTP3
    LICENSE_NGTCP2
    LICENSE_ZLIB
    LICENSE_ZSTD

jobs:
  build-windows:
    name: Build windows binaries
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { sys: vcvars64, env: x86_64, runner: windows-2022 }
          - { sys: vcvars32, env: i686, runner: windows-2022 }
          - { sys: vcvarsarm64, env: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: configure Pagefile
        uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc # v1.5
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "C:"

      - name: Install python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install NASM and Make
        shell: cmd # zizmor: ignore[misfeature]
        run: choco install nasm make -y

      - name: Install Ninja for Win-ARM64
        shell: pwsh # zizmor: ignore[misfeature]
        if: matrix.runner == 'windows-11-arm'
        run: |
          Invoke-WebRequest https://github.com/ninja-build/ninja/releases/download/v1.13.1/ninja-winarm64.zip -OutFile ninja-winarm64.zip
          Expand-Archive ninja-winarm64.zip -DestinationPath ninja
          Copy-Item ninja\ninja.exe -Destination "C:\Windows\System32"

      # - name: Setup tmate session for debugging
      #   uses: mxschmitt/action-tmate@v3

      - name: Build
        shell: cmd # zizmor: ignore[misfeature]
        run: ./win/build.bat ${{ matrix.sys }}

      - name: Check build
        shell: bash
        run: make checkbuild CURL_BIN=packages/bin/curl-impersonate.exe

      - name: Build tarballs
        shell: bash
        env:
          VER: "${{ github.head_ref || github.ref_name }}"
        run: |
          set -euo pipefail
          cmake -P build/CollectLicenses.cmake
          license_dir="$GITHUB_WORKSPACE/build/licenses"
          suffix="${{ matrix.env }}-win32"
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            ver="$VER"
            curl_tar="curl-impersonate-${ver}.${suffix}.tar.gz"
            lib_tar="libcurl-impersonate-${ver}.${suffix}.tar.gz"
          else
            curl_tar="curl-impersonate-${suffix}.tar.gz"
            lib_tar="libcurl-impersonate-${suffix}.tar.gz"
          fi
          tar -czf "$curl_tar" -C packages/bin . -C "$license_dir" $LICENSE_FILES
          tar -czf "$lib_tar" -C packages lib include -C "$license_dir" $LICENSE_FILES

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts.windows.${{ matrix.env }}
          path: |
            ./curl-impersonate*.tar.gz
            ./libcurl-impersonate*.tar.gz
