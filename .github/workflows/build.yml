name: "Build on Linux/Darwin/BSD"

on:
  workflow_call:
  push:
    branches:
      - main
      - feature/*
      - bugfix/*
      - chore/*
      - security/*
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: 11.0
  API: "21"  # Targeting an very old android API version
  LICENSE_FILES: >-
    LICENSE
    LICENSE_BORINGSSL
    LICENSE_BROTLI
    LICENSE_CARES
    LICENSE_CURL
    LICENSE_NGHTTP2
    LICENSE_NGHTTP3
    LICENSE_NGTCP2
    LICENSE_ZLIB
    LICENSE_ZSTD

jobs:
  build:
    name: (${{ matrix.host_label }}) Build curl-impersonate
    runs-on: ${{ matrix.os }}
    concurrency: &build-concurrency
      group: build-unix-${{ github.ref }}-${{ matrix.host_label }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            host: x86_64-linux-gnu
            host_label: x86_64-linux-gnu
            zigflags: -target x86_64-linux-gnu.2.17.0
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            host: x86_64-linux-musl
            host_label: x86_64-linux-musl
            zigflags: -target x86_64-linux-musl -fPIC
          - os: ubuntu-latest
            platform: linux
            arch: i386
            host: i386-linux-gnu
            host_label: i386-linux-gnu
            zigflags: -target x86-linux-gnu.2.17.0
          - os: ubuntu-latest
            platform: linux
            arch: aarch64
            host: aarch64-linux-gnu
            host_label: aarch64-linux-gnu
            zigflags: -target aarch64-linux-gnu.2.17.0
          - os: ubuntu-latest
            platform: linux
            arch: aarch64
            host: aarch64-linux-musl
            host_label: aarch64-linux-musl
            zigflags: -target aarch64-linux-musl -fPIC -mno-outline-atomics
          - os: ubuntu-latest
            platform: linux
            arch: arm
            host: arm-linux-gnueabihf
            host_label: arm-linux-gnueabihf
            zigflags: -target arm-linux-gnueabihf.2.17.0 -mcpu=arm1176jzf_s
          - os: ubuntu-latest
            platform: linux
            arch: arm
            host: arm-linux-gnueabi
            host_label: arm-linux-gnueabi
            zigflags: -target arm-linux-gnueabi
          - os: ubuntu-latest
            platform: linux
            arch: riscv64
            host: riscv64-linux-gnu
            host_label: riscv64-linux-gnu
            zigflags: -target riscv64-linux-gnu.2.27.0
          - os: ubuntu-latest
            platform: linux
            arch: riscv64
            host: riscv64-linux-musl
            host_label: riscv64-linux-musl
            zigflags: -target riscv64-linux-musl -fPIC
          - os: ubuntu-latest
            platform: linux
            arch: loongarch64
            host: loongarch64-linux-gnu
            host_label: loongarch64-linux-gnu
            zigflags: -target loongarch64-linux-gnu.2.36.0 -fPIC
          - os: ubuntu-latest
            platform: android
            arch: aarch64
            host: aarch64-linux-android
            host_label: aarch64-linux-android
          - os: ubuntu-latest
            platform: android
            arch: x86_64
            host: x86_64-linux-android
            host_label: x86_64-linux-android
          - os: ubuntu-latest
            platform: android
            arch: x86
            host: i686-linux-android
            host_label: x86-linux-android
          - os: ubuntu-latest
            platform: android
            arch: armv7
            host: armv7a-linux-androideabi
            host_label: armv7-linux-android
    steps:
      - &checkout
        name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up zig
        if: matrix.platform == 'linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Set zig env
        if: matrix.platform == 'linux'
        run: |
          echo "CC=${{ github.workspace }}/zigshim/cc" >> $GITHUB_ENV
          echo "CXX=${{ github.workspace }}/zigshim/cxx" >> $GITHUB_ENV
          echo "AR=${{ github.workspace }}/zigshim/ar" >> $GITHUB_ENV
          echo "ZIG_FLAGS=${{ matrix.zigflags }}" >> $GITHUB_ENV

      - name: Set up Android NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Set Android toolchain env
        if: matrix.platform == 'android'
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          TARGET="${{ matrix.host }}"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN/bin/${TARGET}${API}-clang" >> $GITHUB_ENV
          echo "AS=$TOOLCHAIN/bin/${TARGET}${API}-clang" >> $GITHUB_ENV
          echo "CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++" >> $GITHUB_ENV
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "CFLAGS=-fPIC" >> $GITHUB_ENV
          echo "CXXFLAGS=-fPIC" >> $GITHUB_ENV

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install build-essential pkg-config cmake ninja-build curl qemu-user libc6-i386-cross
          sudo apt-get install gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-arm-linux-gnueabi gcc-riscv64-linux-gnu gcc-14-loongarch64-linux-gnu

      - &build-target
        name: Build
        run: |
          set -e
          install_dir="${{ runner.temp }}/install"
          mkdir -p "$install_dir"

          if [[ "${{ matrix.host }}" == "arm-linux-gnueabi" ]]; then
            LDFLAGS="$("${{ github.workspace }}/zigshim/atomics/arm_linux_gnueabi_prepare.sh")"
            export LDFLAGS
            echo "LDFLAGS=$LDFLAGS" >> $GITHUB_ENV
          fi

          cmake_args="-G Ninja -DCMAKE_INSTALL_PREFIX=$install_dir"
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            cmake_args="$cmake_args -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }}"
            cmake_args="$cmake_args -DCURL_CA_PATH=/etc/ssl/certs -DCURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt"
          elif [[ "${{ matrix.platform }}" == "android" ]]; then
            case "${{ matrix.arch }}" in
              aarch64) android_abi="arm64-v8a" ;;
              armv7) android_abi="armeabi-v7a" ;;
              x86) android_abi="x86" ;;
              x86_64) android_abi="x86_64" ;;
              *) echo "Unsupported Android arch: ${{ matrix.arch }}"; exit 1 ;;
            esac
            cmake_args="$cmake_args -DCMAKE_SYSTEM_NAME=Android"
            cmake_args="$cmake_args -DCMAKE_ANDROID_NDK=${ANDROID_NDK_HOME} -DCMAKE_ANDROID_ARCH_ABI=$android_abi -DCMAKE_SYSTEM_VERSION=${API}"
          fi

          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            make prepare-libidn2 BUILD_DIR=build
          fi
          make build BUILD_DIR=build CMAKE_CONFIGURE_ARGS="$cmake_args"
          if [[ "${{ matrix.platform }}" == "linux" || "${{ matrix.host_label }}" == "arm64-macos" ]]; then
            curl_runner=""
            if [[ "${{ matrix.platform }}" == "linux" ]]; then
              case "${{ matrix.arch }}" in
                x86_64) ;;
                i386) curl_runner="qemu-i386 -L /usr/i686-linux-gnu" ;;
                aarch64) curl_runner="qemu-aarch64" ;;
                arm) curl_runner="qemu-arm" ;;
                riscv64) curl_runner="qemu-riscv64" ;;
                loongarch64) curl_runner="qemu-loongarch64" ;;
                *) echo "Unsupported Linux arch: ${{ matrix.arch }}"; exit 1 ;;
              esac
              if [[ -n "$curl_runner" && "${{ matrix.arch }}" != "i386" && "${{ matrix.host }}" == *gnu* ]]; then
                curl_runner="$curl_runner -L /usr/${{ matrix.host }}"
              fi
            fi
            make checkbuild BUILD_DIR=build CURL_RUNNER="$curl_runner" CMAKE_CONFIGURE_ARGS="$cmake_args"
          elif [[ "${{ matrix.platform }}" == "ios" ]]; then
            if [[ ! -f build/deps/build/curl/src/curl-impersonate.app/curl-impersonate ]]; then
              echo "Missing iOS curl-impersonate artifact: build/deps/build/curl/src/curl-impersonate.app/curl-impersonate" >&2
              find build/deps/build/curl -maxdepth 3 -type f -name 'curl*' -print >&2
              exit 1
            fi
            echo "Built iOS curl-impersonate artifact: ${{ matrix.host_label }}"
          else
            echo "Skipping checkbuild for non-native target: ${{ matrix.host_label }}"
          fi
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            cmake --install build --strip
            lipo -verify_arch "${{ matrix.arch }}" "$install_dir/bin/curl-impersonate"
          elif [[ "${{ runner.os }}" == "Linux" && "${{ endsWith(matrix.host, 'musl') }}" == "true" ]]; then
            make install BUILD_DIR=build CMAKE_CONFIGURE_ARGS="$cmake_args"
          else
            make install-strip BUILD_DIR=build CMAKE_CONFIGURE_ARGS="$cmake_args"
          fi

      - &package-target
        name: Create tar release files
        run: |
          set -e
          install_dir="${{ runner.temp }}/install"
          install_lib_dir="$install_dir/lib"
          deps_lib_dir="${{ github.workspace }}/build/deps/install/lib"
          cmake -P build/CollectLicenses.cmake
          license_dir="${{ github.workspace }}/build/licenses"
          license_files="$LICENSE_FILES"
          if [[ -f "$license_dir/LICENSE_LIBIDN2_LGPL3" ]]; then
            license_files="$license_files LICENSE_LIBIDN2_GPL2 LICENSE_LIBIDN2_GPL3 LICENSE_LIBIDN2_LGPL3 LICENSE_LIBIDN2_UNICODE"
          fi

          if [[ "${{ matrix.platform }}" != "android" ]]; then
            cp "$deps_lib_dir/libcares.a" "$install_lib_dir/"
          fi
          cp "$deps_lib_dir/libz.a" "$install_lib_dir/"
          cp "$deps_lib_dir/libzstd.a" "$install_lib_dir/"
          cp "$deps_lib_dir/libbrotlidec.a" "$install_lib_dir/"
          cp "$deps_lib_dir/libbrotlicommon.a" "$install_lib_dir/"
          cp "$deps_lib_dir/libbrotlienc.a" "$install_lib_dir/"
          cp "$deps_lib_dir/libnghttp2.a" "$install_lib_dir/"
          cp "$deps_lib_dir/libnghttp3.a" "$install_lib_dir/"
          cp "$deps_lib_dir/libngtcp2.a" "$install_lib_dir/"
          cp "$deps_lib_dir/libngtcp2_crypto_boringssl.a" "$install_lib_dir/"
          cp "$deps_lib_dir/libssl.a" "$install_lib_dir/"
          cp "$deps_lib_dir/libcrypto.a" "$install_lib_dir/"
          if [[ -f "$deps_lib_dir/libidn2.a" ]]; then
            cp "$deps_lib_dir/libidn2.a" "$install_lib_dir/"
          fi

          cd "$install_lib_dir"
          mv libcurl-impersonate.a libcurl-impersonate.orig.a
          lib_list="libcurl-impersonate.orig.a libz.a libzstd.a libbrotlidec.a libbrotlicommon.a libbrotlienc.a libnghttp2.a libnghttp3.a libngtcp2.a libngtcp2_crypto_boringssl.a libssl.a libcrypto.a"
          if [[ "${{ matrix.platform }}" != "android" ]]; then
            lib_list="$lib_list libcares.a"
          fi
          if [[ -f libidn2.a ]]; then
            lib_list="$lib_list libidn2.a"
          fi
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            cmake \
              "-DINPUT_PC=${{ github.workspace }}/build/deps/build/curl/libcurl.pc" \
              "-DDEPENDENCY_PREFIX=${{ github.workspace }}/build/deps/install" \
              "-DLIBRARY_DIR=$install_lib_dir" \
              "-DARCHIVES=${lib_list// /;}" \
              -P "${{ github.workspace }}/cmake/ReleasePkgConfig.cmake"
          fi
          if [[ "${{ runner.os }}" == "macOS" || "${{ matrix.platform }}" == "ios" ]]; then
            libtool -static -o libcurl-impersonate.a $lib_list
          elif [[ "${{ matrix.platform }}" == "linux" ]]; then
            # Zig omits its implicit C++ runtime for relocatable links. Ask it
            # for the target-specific runtime archives, then merge only the
            # members needed by BoringSSL into the release archive.
            cxx_link="$($CXX -### -shared -o libcurl-impersonate.runtime-probe.so libcurl-impersonate.orig.a 2>&1)"
            libcxx="$(printf '%s\n' "$cxx_link" | grep -oE '/[^[:space:]]+/libc\+\+\.a' | head -n 1)"
            libcxxabi="$(printf '%s\n' "$cxx_link" | grep -oE '/[^[:space:]]+/libc\+\+abi\.a' | head -n 1)"
            libunwind="$(printf '%s\n' "$cxx_link" | grep -oE '/[^[:space:]]+/libunwind\.a' | head -n 1)"
            if [[ ! -f "$libcxx" || ! -f "$libcxxabi" || ! -f "$libunwind" ]]; then
              echo "Unable to locate Zig's target-specific C++ runtime archives" >&2
              echo "$cxx_link" >&2
              exit 1
            fi
            $CC -r -o libcurl-impersonate.full.o \
              -Wl,--whole-archive $lib_list -Wl,--no-whole-archive \
              -Wl,--start-group "$libcxx" "$libcxxabi" "$libunwind" -Wl,--end-group
            $AR rcs libcurl-impersonate.a libcurl-impersonate.full.o
            rm -f libcurl-impersonate.full.o
          else
            $CC -r -o libcurl-impersonate.full.o -Wl,--whole-archive $lib_list -Wl,--no-whole-archive
            ar rcs libcurl-impersonate.a libcurl-impersonate.full.o
            rm -f libcurl-impersonate.full.o
          fi
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            unresolved_cxx="$(nm -u libcurl-impersonate.a | grep -E '[[:space:]]U (_Z|__cxa|__gxx|_Unwind)' || true)"
            if [[ -n "$unresolved_cxx" ]]; then
              echo "Unresolved C++ runtime symbols in libcurl-impersonate.a:" >&2
              echo "$unresolved_cxx" >&2
              exit 1
            fi
          fi
          rm -f libcares.a libz.a libzstd.a libbrotlidec.a libbrotlicommon.a libbrotlienc.a libnghttp2.a libnghttp3.a libngtcp2.a libngtcp2_crypto_boringssl.a libssl.a libcrypto.a libidn2.a
          rm -f libcurl-impersonate.orig.a
          ls -lah .
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            release_file_lib="${{ runner.temp }}/libcurl-impersonate-${{ github.ref_name }}.${{ matrix.host_label }}.tar.gz"
          else
            release_file_lib="${{ runner.temp }}/libcurl-impersonate.${{ matrix.host_label }}.tar.gz"
          fi
          tar -c -z -f "$release_file_lib" -C "$install_lib_dir" lib* -C "$install_dir" include -C "$license_dir" $license_files
          echo "release_file_lib=$release_file_lib" >> $GITHUB_ENV

          cd "$install_dir/bin"
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            tar -c -z -f ${{ runner.temp }}/curl-impersonate-${{ github.ref_name }}.${{ matrix.host_label }}.tar.gz curl-impersonate curl_* -C "$license_dir" $license_files
          else
            tar -c -z -f ${{ runner.temp }}/curl-impersonate.${{ matrix.host_label }}.tar.gz curl-impersonate curl_* -C "$license_dir" $license_files
          fi

      - &upload-target
        name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts.${{ matrix.host_label }}
          compression-level: 0
          path: |
            ${{ runner.temp }}/libcurl-impersonate*.tar.gz
            ${{ runner.temp }}/curl-impersonate*.tar.gz

  apple-changes:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for Apple build changes
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # The first parent of GitHub's test merge commit is the PR base.
            base=HEAD^1
          fi
          if ! git diff --quiet "$base" HEAD -- CMakeLists.txt Makefile cmake patches src include bin \
              LICENSE browsers.json scripts/generate_fingerprints.py tests/pkgconfig \
              .github/workflows/{build,release}.yml .github/apple-toolchain.cmake; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build-apple-native:
    needs: apple-changes
    if: needs.apple-changes.outputs.changed == 'true'
    name: (${{ matrix.host_label }}) Build curl-impersonate
    # Fork pull requests use a fresh Mac without NoMac's persistent disk.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'nomac' || 'nomac-cache' }}
    concurrency: *build-concurrency
    strategy:
      matrix:
        include:
          - &native-macos
            platform: macos
            sdk: macosx
            arch: arm64
            host: arm64-macos
            host_label: arm64-macos
    steps: &apple-steps
      - *checkout

      - name: Prepare Apple build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          missing=()
          for tool in cmake ninja pkg-config ccache; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          if (( ${#missing[@]} )); then brew install "${missing[@]}"; fi
          sdk=${{ matrix.sdk }}
          sdkroot=$(xcrun --sdk "$sdk" --show-sdk-path)
          sdk_build=$(xcrun --sdk "$sdk" --show-sdk-build-version)
          xcode_build=$(xcodebuild -version | awk '/Build version/ {print $3}')
          {
            echo "APPLE_ARCH=${{ matrix.arch }}"
            echo "APPLE_SDK=$sdk"
            if [[ "$sdk" != macosx ]]; then
              # Xcode 27 libc++ warns about the iOS 13 target. BoringSSL uses -Werror.
              echo "CXXFLAGS=-Wno-error=cpp"
              echo "APPLE_MIN_VERSION=13.0"
            else
              echo "APPLE_MIN_VERSION=$MACOSX_DEPLOYMENT_TARGET"
            fi
            echo "SDKROOT=$sdkroot"
            echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/.github/apple-toolchain.cmake"
            # Each ExternalProject also runs a parallel build.
            echo "JOBS=2"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_MAXSIZE=400M"
            echo "APPLE_TOOLCHAIN=$xcode_build-$sdk_build"
          } >> "$GITHUB_ENV"

      - name: Cache verified upstream archives
        uses: actions/cache@v4
        with:
          path: |
            build/*-prefix/src/*.tar.gz
            build/*-prefix/src/*.tar.bz2
            build/*-prefix/src/*.zip
          key: apple-downloads-v1-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: apple-downloads-v1-

      - name: Cache Apple compiler objects
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: apple-ccache-${{ matrix.host_label }}-${{ env.APPLE_TOOLCHAIN }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'patches/**', 'include/**', 'src/**', '.github/apple-toolchain.cmake', '.github/workflows/build.yml') }}
          restore-keys: apple-ccache-${{ matrix.host_label }}-${{ env.APPLE_TOOLCHAIN }}-

      - *build-target
      - *package-target

      - name: Verify macOS release pkg-config
        if: matrix.platform == 'macos'
        run: |
          release_dir="$RUNNER_TEMP/release with spaces"
          mkdir -p "$release_dir"
          tar -xzf "$release_file_lib" -C "$release_dir"
          cmake -S tests/pkgconfig -B "$RUNNER_TEMP/pkgconfig-consumer" \
            -DRELEASE_DIR="$release_dir" \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build "$RUNNER_TEMP/pkgconfig-consumer"
          if [[ "${{ matrix.arch }}" == "$(uname -m)" ]]; then
            ctest --test-dir "$RUNNER_TEMP/pkgconfig-consumer" --output-on-failure
          fi

      - name: Create iOS XCFramework slice
        if: matrix.platform == 'ios'
        run: |
          slice_dir="${{ runner.temp }}/ios-slice"
          mkdir -p "$slice_dir/lib" "$slice_dir/include/curl"
          cp "${{ github.workspace }}/build/deps/src/curl/include/curl/"*.h "$slice_dir/include/curl/"
          cp ${{ runner.temp }}/install/lib/libcurl-impersonate.a "$slice_dir/lib/"
          cp "${{ github.workspace }}/build/licenses/"LICENSE* "$slice_dir/"

      - *upload-target

      - name: Upload iOS slice artifact
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: ios-slice.${{ matrix.host_label }}
          path: ${{ runner.temp }}/ios-slice

  build-apple-release:
    if: startsWith(github.ref, 'refs/tags/')
    name: (${{ matrix.host_label }}) Build curl-impersonate
    runs-on: nomac
    concurrency: *build-concurrency
    strategy:
      fail-fast: false
      matrix:
        include:
          - *native-macos
          - platform: ios
            arch: arm64
            host: arm64-apple-ios
            host_label: arm64-apple-ios
            sdk: iphoneos
          - platform: ios
            arch: arm64
            host: arm64-apple-ios
            host_label: arm64-apple-ios-simulator
            sdk: iphonesimulator
          - platform: ios
            arch: x86_64
            host: x86_64-apple-ios
            host_label: x86_64-apple-ios-simulator
            sdk: iphonesimulator
          - platform: macos
            sdk: macosx
            arch: x86_64
            host: x86_64-macos
            host_label: x86_64-macos
    steps: *apple-steps

  build-bsd:
    name: (${{ matrix.host_label }}) Build curl-impersonate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: FreeBSD
            vm_arch: x86_64
            host_label: x86_64-freebsd
            release_only: false
          - os: FreeBSD
            vm_arch: aarch64
            host_label: aarch64-freebsd
            release_only: true
          - os: FreeBSD
            vm_arch: riscv64
            host_label: riscv64-freebsd
            release_only: true
          - os: OpenBSD
            vm_arch: x86_64
            host_label: x86_64-openbsd
            release_only: false
          - os: OpenBSD
            vm_arch: aarch64
            host_label: aarch64-openbsd
            release_only: true
          - os: OpenBSD
            vm_arch: riscv64
            host_label: riscv64-openbsd
            release_only: true
    steps:
      - name: Skip release-only ${{ matrix.os }} target
        if: ${{ matrix.release_only && !startsWith(github.ref, 'refs/tags/') }}
        run: echo "Skipping ${{ matrix.host_label }} outside release tag builds."

      - name: Check out the repo
        if: ${{ !matrix.release_only || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/checkout@v4

      - name: Start FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        if: ${{ matrix.os == 'FreeBSD' && (!matrix.release_only || startsWith(github.ref, 'refs/tags/')) }}
        with:
          release: "15.1"
          arch: ${{ matrix.vm_arch }}
          cpu: 4
          mem: 8192
          custom-shell-name: vmsh
          prepare: |
            export IGNORE_OSVERSION=yes
            pkg update -f
            pkg install -y pkgconf cmake-core ninja gmake

      - name: Start OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        if: ${{ matrix.os == 'OpenBSD' && (!matrix.release_only || startsWith(github.ref, 'refs/tags/')) }}
        with:
          release: "8.0"
          arch: ${{ matrix.vm_arch }}
          cpu: 4
          mem: 8192
          custom-shell-name: vmsh
          prepare: |
            pkg_add -Uu
            pkg_add cmake ninja gmake

      - name: Build in ${{ matrix.os }}
        if: ${{ !matrix.release_only || startsWith(github.ref, 'refs/tags/') }}
        shell: vmsh {0}
        run: |
          set -e
          install_dir="$PWD/install"
          artifacts_dir="$PWD/artifacts"
          license_files="LICENSE LICENSE_BORINGSSL LICENSE_BROTLI LICENSE_CARES LICENSE_CURL LICENSE_NGHTTP2 LICENSE_NGHTTP3 LICENSE_NGTCP2 LICENSE_ZLIB LICENSE_ZSTD"
          rm -rf build "$install_dir" "$artifacts_dir"
          mkdir -p "$install_dir" "$artifacts_dir"

          cmake_args="-G Ninja -DCMAKE_INSTALL_PREFIX=$install_dir"
          cmake_args="$cmake_args -DUSE_LIBIDN2=OFF"

          gmake configure BUILD_DIR=build CMAKE_CONFIGURE_ARGS="$cmake_args"
          gmake build BUILD_DIR=build CMAKE_CONFIGURE_ARGS="$cmake_args"

          gmake checkbuild BUILD_DIR=build CHECK_IDN=0

          gmake install-strip BUILD_DIR=build CMAKE_CONFIGURE_ARGS="$cmake_args"
          cmake -P build/CollectLicenses.cmake
          license_dir="$PWD/build/licenses"

          install_lib_dir="$install_dir/lib"
          deps_lib_dir="$PWD/build/deps/install/lib"
          deps_libs="libcares.a libz.a libzstd.a libbrotlidec.a libbrotlicommon.a libbrotlienc.a libnghttp2.a libnghttp3.a libngtcp2.a libngtcp2_crypto_boringssl.a libssl.a libcrypto.a"

          for lib in $deps_libs; do
            cp "$deps_lib_dir/$lib" "$install_lib_dir/"
          done

          cd "$install_lib_dir"
          mv libcurl-impersonate.a libcurl-impersonate.orig.a
          cc -r -o libcurl-impersonate.full.o -Wl,--whole-archive \
            libcurl-impersonate.orig.a $deps_libs \
            -Wl,--no-whole-archive
          ar rcs libcurl-impersonate.a libcurl-impersonate.full.o
          rm -f libcurl-impersonate.full.o
          rm -f $deps_libs
          rm -f libcurl-impersonate.orig.a

          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            tar -czf "$artifacts_dir/libcurl-impersonate-${{ github.ref_name }}.${{ matrix.host_label }}.tar.gz" lib* -C "$install_dir" include -C "$license_dir" $license_files
            cd "$install_dir/bin"
            tar -czf "$artifacts_dir/curl-impersonate-${{ github.ref_name }}.${{ matrix.host_label }}.tar.gz" curl-impersonate curl_* -C "$license_dir" $license_files
          else
            tar -czf "$artifacts_dir/libcurl-impersonate.${{ matrix.host_label }}.tar.gz" lib* -C "$install_dir" include -C "$license_dir" $license_files
            cd "$install_dir/bin"
            tar -czf "$artifacts_dir/curl-impersonate.${{ matrix.host_label }}.tar.gz" curl-impersonate curl_* -C "$license_dir" $license_files
          fi

      - name: Upload ${{ matrix.os }} artifacts
        if: ${{ !matrix.release_only || startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts.${{ matrix.host_label }}
          path: artifacts/*.tar.gz

  ios-xcframework:
    name: (iOS) Create XCFramework
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: nomac
    needs: build-apple-release
    steps:
      - name: Download device slice
        uses: actions/download-artifact@v4
        with:
          name: ios-slice.arm64-apple-ios
          path: ${{ runner.temp }}/ios/device

      - name: Download simulator slice
        uses: actions/download-artifact@v4
        with:
          name: ios-slice.arm64-apple-ios-simulator
          path: ${{ runner.temp }}/ios/simulator-arm64

      - name: Download Intel simulator slice
        uses: actions/download-artifact@v4
        with:
          name: ios-slice.x86_64-apple-ios-simulator
          path: ${{ runner.temp }}/ios/simulator-x86_64

      - name: Create universal simulator slice
        run: |
          mkdir -p ${{ runner.temp }}/ios/simulator/lib
          cp -R ${{ runner.temp }}/ios/simulator-arm64/include ${{ runner.temp }}/ios/simulator/
          lipo -create \
            ${{ runner.temp }}/ios/simulator-arm64/lib/libcurl-impersonate.a \
            ${{ runner.temp }}/ios/simulator-x86_64/lib/libcurl-impersonate.a \
            -output ${{ runner.temp }}/ios/simulator/lib/libcurl-impersonate.a

      - name: Create XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library ${{ runner.temp }}/ios/device/lib/libcurl-impersonate.a \
            -headers ${{ runner.temp }}/ios/device/include \
            -library ${{ runner.temp }}/ios/simulator/lib/libcurl-impersonate.a \
            -headers ${{ runner.temp }}/ios/simulator/include \
            -output ${{ runner.temp }}/libcurl-impersonate.xcframework

          cd ${{ runner.temp }}
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            tar -c -z -f ${{ runner.temp }}/libcurl-impersonate-${{ github.ref_name }}.ios-xcframework.tar.gz libcurl-impersonate.xcframework -C ${{ runner.temp }}/ios/device $LICENSE_FILES
          else
            tar -c -z -f ${{ runner.temp }}/libcurl-impersonate.ios-xcframework.tar.gz libcurl-impersonate.xcframework -C ${{ runner.temp }}/ios/device $LICENSE_FILES
          fi

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts.ios-xcframework
          compression-level: 0
          path: ${{ runner.temp }}/libcurl-impersonate*.ios-xcframework.tar.gz
