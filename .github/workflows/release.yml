name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build-unix:
    name: Build Linux, macOS, BSD, Android, and iOS artifacts
    uses: $/.github/workflows/build.yml
    permissions:
      contents: read

  build-windows:
    name: Build Windows artifacts
    uses: $/.github/workflows/build-win.yaml
    permissions:
      contents: read

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build-unix
      - build-windows
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts.*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Collect release files
        id: collect-release-files
        run: |
          shopt -s nullglob
          files=("${{ runner.temp }}/release-assets"/*.tar.gz)

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          printf 'Release assets:\n'
          printf ' - %s\n' "${files[@]##*/}"

          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_FILES: ${{ steps.collect-release-files.outputs.files }}
        run: |
          gh release create "$REF_NAME" $RELEASE_FILES \
          --verify-tag \
          --prerelease="${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}" \
          --draft="${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}"
