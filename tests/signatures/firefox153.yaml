browser:
  name: firefox
  version: '153'
  os: windows_10
  target: firefox153
signature:
  options:
    tls_permute_extensions: false
  http2:
    frames:
    - frame_type: SETTINGS
      settings:
      - key: 1
        value: 65536
      - key: 2
        value: 0
      - key: 4
        value: 131072
      - key: 5
        value: 16384
      stream_id: 0
    - frame_type: WINDOW_UPDATE
      stream_id: 0
      window_size_increment: 12517377
    - frame_type: HEADERS
      stream_id: 1
      headers:
      - 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:153.0) Gecko/20100101
        Firefox/153.0'
      - 'accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
      - 'accept-language: en-US,en;q=0.9'
      - 'accept-encoding: gzip, deflate, br, zstd'
      - 'sec-fetch-dest: empty'
      - 'sec-fetch-mode: cors'
      - 'sec-fetch-site: same-origin'
      - 'priority: u=4'
      - 'te: trailers'
      pseudo_headers:
      - :method
      - :path
      - :authority
      - :scheme
  tls_client_hello:
    partial: true
    ciphersuites:
    - 4865
    - 4867
    - 4866
    - 49195
    - 49199
    - 52393
    - 52392
    - 49196
    - 49200
    - 49162
    - 49171
    - 49172
    - 156
    - 157
    - 47
    - 53
    extensions:
    - type: server_name
    - type: extended_master_secret
    - type: renegotiation_info
    - type: supported_groups
      supported_groups:
      - 4588
      - 29
      - 23
      - 24
      - 25
      - 256
      - 257
    - type: ec_point_formats
    - type: session_ticket
    - type: application_layer_protocol_negotiation
    - type: status_request
    - type: delegated_credentials
      sig_hash_algs:
      - 1027
      - 1283
      - 1539
      - 515
    - type: signed_certificate_timestamp
    - type: keyshare
    - type: supported_versions
    - type: signature_algorithms
      sig_hash_algs:
      - 1027
      - 1283
      - 1539
      - 2052
      - 2053
      - 2054
      - 1025
      - 1281
      - 1537
      - 515
      - 513
    - type: psk_key_exchange_modes
    - type: record_size_limit
      record_size_limit: 16385
    - type: compress_certificate
      algorithms:
      - 1
      - 2
      - 3
    - type: encrypted_client_hello
    grease: false
